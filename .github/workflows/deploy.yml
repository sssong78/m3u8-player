name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # 添加构建时需要的环境变量
          NEXT_PUBLIC_APP_URL: https://m3u8-player.pages.dev

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: m3u8-player
          directory: .next
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # 可选：分支预览
          branch: ${{ github.ref_name }}
          # 可选：工作目录
          workingDirectory: './'
          # 可选：跳过缓存
          skipCaching: false